<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrollGui • Modern</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0b0d12;
            color: #eef2f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1360px;
            width: 100%;
            background: rgba(18, 22, 32, 0.7);
            backdrop-filter: blur(2px);
            padding: 28px 30px 34px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.02);
            position: relative;
        }
        .container::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(80, 120, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(80, 120, 255, 0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            border-radius: 40px;
        }
        .header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            gap: 12px 18px;
        }
        .title-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        h1 {
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #d0e0ff, #9bbaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .led {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(30, 40, 60, 0.5);
            padding: 6px 14px 6px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 14px;
            color: #b0c7e7;
        }
        .led-dot {
            width: 10px;
            height: 10px;
            border-radius: 10px;
            background: #3f8cff;
            box-shadow: 0 0 6px #3f8cffaa, 0 0 12px #3f8cff55;
            transition: 0.25s;
        }
        .led-dot.green {
            background: #3bdb8a;
            box-shadow: 0 0 8px #3bdb8aaa, 0 0 18px #3bdb8a55;
        }
        .led-dot.amber {
            background: #f5b342;
            box-shadow: 0 0 8px #f5b342aa, 0 0 18px #f5b34255;
        }
        .desc {
            color: #95aac9;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(2px);
        }
        .tabs {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .tab {
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            background: transparent;
            color: #8899bb;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }
        .tab.active {
            background: #1f2a3d;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
        }
        .page {
            display: none;
            animation: fadeIn 0.2s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 18px 0 22px;
        }
        .editor-box {
            background: #11161f;
            border-radius: 24px;
            border: 1px solid #262e3e;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5), 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: 0.15s;
            display: flex;
            flex-direction: column;
        }
        .editor-box:focus-within {
            border-color: #3f8cff;
            box-shadow: 0 0 0 2px #3f8cff22, inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        .box-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            background: #1a212d;
            border-bottom: 1px solid #262e3e;
            border-radius: 24px 24px 0 0;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.2px;
            color: #b8cef0;
        }
        .box-header .badge {
            background: #29354b;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            color: #aec3e6;
            letter-spacing: 0.3px;
        }
        textarea {
            display: block;
            width: 100%;
            height: 380px;
            resize: vertical;
            border: 0;
            outline: none;
            padding: 18px 20px;
            background: #0d121c;
            color: #e5edf8;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            font-size: 14px;
            line-height: 1.6;
            border-radius: 0 0 24px 24px;
            transition: background 0.1s;
        }
        textarea:read-only {
            background: #0b1019;
            color: #b8cef0;
        }
        textarea::placeholder {
            color: #475570;
            font-weight: 400;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 14px;
            margin-top: 6px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            border: 0;
            border-radius: 40px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 14px;
            background: #202a3b;
            color: #d6e4ff;
            cursor: pointer;
            transition: 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            letter-spacing: 0.2px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            background: #2d3a52;
            border-color: #3f5a7a;
        }
        .btn-primary {
            background: #2c7a4b;
            color: white;
            box-shadow: 0 4px 12px #1f5a3880;
        }
        .btn-primary:hover {
            background: #3a9b60;
            border-color: #3bdb8a;
            box-shadow: 0 6px 18px #2c7a4baa;
        }
        .btn-copy {
            background: #2a4b7a;
            color: white;
        }
        .btn-copy:hover {
            background: #3a64a0;
            border-color: #6a9eff;
        }
        .btn-danger {
            background: #7a2e3a;
            color: #ffd6d6;
        }
        .btn-danger:hover {
            background: #a03e4e;
            border-color: #ff7a7a;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #31405a;
            color: #b0c7e7;
        }
        .btn-outline:hover {
            background: #1f2a3d;
            border-color: #4f6b92;
        }
        .file-label {
            background: #1f2840;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #31405a;
            font-weight: 500;
        }
        .file-label:hover {
            background: #2c3a58;
            border-color: #5a7aa8;
        }
        input[type="file"] {
            display: none;
        }
        .status {
            margin-top: 18px;
            padding: 10px 18px;
            border-radius: 40px;
            background: #151e2b;
            border: 1px solid #26303f;
            color: #9eb3d3;
            font-size: 14px;
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            flex-wrap: wrap;
        }
        .status .led-dot {
            width: 8px;
            height: 8px;
            flex-shrink: 0;
        }
        .functions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin: 14px 0 8px;
        }
        .func-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 18px 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #bbb;
            transition: 0.2s;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }
        .func-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        .func-card .badge {
            display: block;
            font-size: 9px;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 40px;
            color: #cccccc;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #18181f;
            border-radius: 24px;
            max-width: 480px;
            width: 92%;
            padding: 30px 26px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.94) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .modal-box p {
            line-height: 1.6;
            color: #bbb;
            font-size: 14px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .modal-box p::-webkit-scrollbar {
            width: 3px;
        }
        .modal-box p::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        .modal-close {
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 28px;
            border-radius: 40px;
            color: #999;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #1e3a2a;
            padding: 12px 26px;
            border-radius: 60px;
            color: #8bc34a;
            font-weight: 500;
            font-size: 14px;
            opacity: 0;
            transform: translateY(12px);
            transition: 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            border: 1px solid rgba(139, 195, 74, 0.08);
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .download-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            padding: 30px 10px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            min-height: 340px;
        }
        .download-card .icon {
            font-size: 64px;
            opacity: 0.6;
        }
        .download-card h2 {
            font-size: 38px;
            font-weight: 300;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff, #b0b0b0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .download-card .sub {
            color: #666;
            font-size: 14px;
            margin-top: -8px;
        }
        @media (max-width: 820px) {
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            textarea {
                height: 260px;
            }
            .container {
                padding: 20px 16px;
            }
            .header-row {
                flex-direction: column;
                align-items: stretch;
            }
            .title-group {
                flex-wrap: wrap;
            }
            .functions-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
        @media (max-width: 480px) {
            .btn {
                padding: 10px 16px;
                font-size: 13px;
            }
            .file-label {
                padding: 10px 16px;
            }
            .download-card h2 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-row">
        <div class="title-group">
            <h1>✦ TrollGui</h1>
            <span class="led">
                <span class="led-dot" id="mainLed"></span>
                <span id="mainLedLabel">pronto</span>
            </span>
        </div>
        <div class="desc">
            <span class="tabs" id="tabContainer">
                <button class="tab active" data-tab="downloads">📦 Downloads</button>
                <button class="tab" data-tab="functions">⚡ Functions</button>
                <button class="tab" data-tab="cleaner">🧹 Luau Cleaner</button>
            </span>
        </div>
    </div>

    <div id="page-downloads" class="page active">
        <div class="download-card">
            <div class="icon">𝓣</div>
            <h2>TrollGui</h2>
            <button class="btn btn-primary" id="copyScriptBtn">📋 Get TrollGui</button>
            <span class="sub">Obtenha o TrollGui • clique para copiar o script</span>
        </div>
    </div>

    <div id="page-functions" class="page">
        <div class="functions-grid" id="functionsGrid"></div>
    </div>

    <div id="page-cleaner" class="page">
        <div class="grid-2">
            <div class="editor-box">
                <div class="box-header">
                    <span>📄 Script original</span>
                    <span class="badge">entrada</span>
                </div>
                <textarea id="inputClean" spellcheck="false" placeholder="Cole seu script Luau aqui ou escreva diretamente..."></textarea>
            </div>
            <div class="editor-box">
                <div class="box-header">
                    <span>✨ Script limpo</span>
                    <span class="badge">saída</span>
                </div>
                <textarea id="outputClean" spellcheck="false" readonly placeholder="O resultado aparecerá após clicar em 'Transformar'"></textarea>
            </div>
        </div>
        <div class="action-bar">
            <div class="btn-group">
                <label class="file-label">
                    📂 Abrir .lua / .luau
                    <input type="file" id="fileInputClean" accept=".lua,.luau,.txt">
                </label>
                <button class="btn btn-primary" id="cleanBtn">🧹 Transformar</button>
                <button class="btn btn-copy" id="copyBtnClean">📋 Copiar</button>
                <button class="btn btn-outline" id="downloadBtnClean">💾 Baixar .lua</button>
                <button class="btn btn-danger" id="clearBtnClean">🗑️ Limpar</button>
            </div>
        </div>
        <div class="status" id="statusClean">
            <span class="led-dot green"></span>
            <span>Cole ou escreva um script e clique em <strong>Transformar</strong></span>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h2 id="modalTitle">Título</h2>
        <p id="modalText">Descrição...</p>
        <button class="modal-close" id="modalCloseBtn">Fechar</button>
    </div>
</div>

<div class="toast" id="toast">✅ Copiado!</div>

<script>
    (function() {
        const mainLed = document.getElementById('mainLed');
        const mainLedLabel = document.getElementById('mainLedLabel');

        function setMainLed(state, label) {
            mainLed.className = 'led-dot';
            if (state === 'green') mainLed.classList.add('green');
            else if (state === 'amber') mainLed.classList.add('amber');
            mainLedLabel.textContent = label || 'pronto';
        }
        setMainLed('green', 'pronto');

        const tabs = document.querySelectorAll('.tab');
        const pages = {
            downloads: document.getElementById('page-downloads'),
            functions: document.getElementById('page-functions'),
            cleaner: document.getElementById('page-cleaner')
        };

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                const target = this.dataset.tab;
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                Object.keys(pages).forEach(key => {
                    pages[key].classList.toggle('active', key === target);
                });
            });
        });

        const scriptText = `loadstring(game:HttpGet("https://raw.githubusercontent.com/TrollGui/TrollGuiScript/refs/heads/main/TrollGui"))()`;
        const toast = document.getElementById('toast');

        document.getElementById('copyScriptBtn').addEventListener('click', function() {
            navigator.clipboard.writeText(scriptText).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2200);
            }).catch(() => {
                const area = document.createElement('textarea');
                area.value = scriptText;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2200);
            });
        });

        const functionsData = [
            { title: "TrollGui", text: "TrollGui é um script de GUI para Roblox. Possui diversos botões, cada um com uma função diferente. Para usar, clique em 'Get TrollGui' e execute o script no seu executor. Tecla R para minimizar, X para fechar. Segurar a tecla ALT irá liberar seu mouse." },
            { title: "Player Tracker", text: "Selecione um jogador por nome ou display name. Veja a foto, rastreie o mais próximo ou aleatório. Com o jogador selecionado, ative funções como ESP, Spectate, Loop Teleport e mais." },
            { title: "Speed", text: "Altere a velocidade do seu personagem. Digite um valor na caixa e clique em 'Set Speed'." },
            { title: "ESP Player / ESP All", text: "ESP Player: destaca o jogador selecionado. ESP All: destaca todos os jogadores do servidor." },
            { title: "Spectate Player", text: "Especte o jogador selecionado. Ative/desative para seguir a câmera." },
            { title: "Loop Teleport & Teleport", text: "Loop Teleport: teleporta você atrás do jogador em loop. Teleport to Player: teleporta uma única vez." },
            { title: "Posição (X,Y,Z)", text: "Teleporte para coordenadas específicas ou pegue sua posição atual." },
            { title: "First Person", text: "Alterna para visão em primeira pessoa." },
            { title: "Fake Death 2", text: "Simula morte, mas você pode voar enquanto 'cai'." },
            { title: "QuietServer", text: "Teleporta para o servidor mais vazio do jogo atual." },
            { title: "Coordinates", text: "Abre um frame com suas coordenadas em tempo real. Copie no formato X: 123.45 | Y: 67.89 | Z: -32.10" },
            { title: "Click = Block", text: "Clique no chão para criar blocos(E pode aumentar eles). Use Delete Part (X) para remover." },
            { title: "WalkAllow", text: "Permite andar mesmo se o jogo bloquear movimento." },
            { title: "Noclip", text: "Atravesse paredes e partes. Combine com CFrameFly para voar." },
            { title: "LoudServer", text: "Teleporta para o servidor mais cheio do jogo atual." },
            { title: "Another Fling", text: "Um fling(que diz ser invisivel mas não é!) muito forte. Recomendado com Loop Teleport." },
            { title: "SpinFling", text: "Gira seu personagem rapidamente. Pode trollar amigos." },
            { title: "Delete Part (X)", text: "Pressione X em uma parte para deletá-la (apenas local)." },
            { title: "Fake Death", text: "Deita no chão. Bom para PvP, inimigos não acertam." },
            { title: "ProximityPrompt Insta", text: "Todos os prompts do jogo ficam instantâneos e ativam à distância e através das paredes." },
            { title: "ClickTp", text: "Clique em qualquer lugar para teleportar." },
            { title: "Humanoid/GUI", text: "Deixa eu jogador totalmente bugado(Aparece a Hitbox dele, e o que tem escondido do seu jogador visivel, e TODAS as GUIS do jogo serão visiveis)." },
            { title: "Unblock all", text: "Desbloqueia chat, emotes, backpack, leaderboard e mais." },
            { title: "Kill", text: "Mata seu personagem instantaneamente." },
            { title: "Audio Viewer", text: "Visualiza todos os sons do jogo." },
            { title: "CFrameFly", text: "Voe em CFrame (não detectado como voo pelos anticheats)." },
            { title: "float", text: "Flutua no ar em loop." },
            { title: "WalkFling", text: "Abre uma GUI de Fling, Quando ativo, encoste em jogadores para arremessá-los." },
            { title: "Freecam", text: "Libera a câmera para voar livremente." },
            { title: "Egor Mode", text: "Animações aceleradas." },
            { title: "Infinite Jump", text: "Pule quantas vezes quiser no ar." },
            { title: "Dex", text: "Abre o Dex Explorer (visualizar arquivos do jogo)." },
            { title: "Rejoin", text: "Reentra no mesmo jogo." },
            { title: "Freeze Mode", text: "Um FAKE LAG, no caso animação de andar parado." },
            { title: "FullBright", text: "Clareia o jogo e remove o FOG." },
            { title: "Places Viewer", text: "Mostra todas as sub-places do jogo atual." },
            { title: "Beta Mode", text: "Animações lentas." },
            { title: "GodMode", text: "Você não morre para KillBrick em jogos como parkour(por que usa CanTouch = false)." },
            { title: "Underground", text: "Te esconde debaixo do mapa." },
            { title: "ReviveFree", text: "Tenta reviver automaticamente usando remotes." },
            { title: "Word Searcher", text: "Usado em jogos como LAST LETTER ou algo do tipo para digitar sozinho o restante de uma palavra." },
            { title: "Invisivel", text: "Criado por mim, este script faz você ficar invisivel!(alguns anti cheats pegam você com isso!)." }
        ];

        const grid = document.getElementById('functionsGrid');
        functionsData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'func-card';
            card.innerHTML = `${item.title} <span class="badge">#${index + 1}</span>`;
            card.addEventListener('click', () => {
                document.getElementById('modalTitle').textContent = item.title;
                document.getElementById('modalText').textContent = item.text;
                document.getElementById('modalOverlay').classList.add('open');
            });
            grid.appendChild(card);
        });

        const modalOverlay = document.getElementById('modalOverlay');
        document.getElementById('modalCloseBtn').addEventListener('click', () => {
            modalOverlay.classList.remove('open');
        });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('open');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey) {
                const container = document.querySelector('.container');
                container.style.transition = 'opacity 0.15s';
                container.style.opacity = container.style.opacity === '0.15' ? '1' : '0.15';
            }
        });

        // ========== Luau Cleaner ==========
        const input = document.getElementById('inputClean');
        const output = document.getElementById('outputClean');
        const fileInput = document.getElementById('fileInputClean');
        const statusDiv = document.getElementById('statusClean');

        function setStatus(message, type = 'info') {
            const dot = statusDiv.querySelector('.led-dot');
            if (dot) {
                dot.className = 'led-dot';
                if (type === 'ok') dot.classList.add('green');
                else if (type === 'warn') dot.classList.add('amber');
                else dot.classList.add('green');
            }
            const textSpan = statusDiv.querySelector('span:last-child') || statusDiv;
            if (textSpan.tagName === 'SPAN') {
                textSpan.innerHTML = message;
            } else {
                statusDiv.innerHTML = `<span class="led-dot green"></span><span>${message}</span>`;
            }
        }

        function removeComments(code) {
            let result = '';
            let i = 0;
            let quote = null;
            let escaped = false;
            while (i < code.length) {
                const char = code[i];
                const next = code[i + 1];
                if (quote !== null) {
                    result += char;
                    if (escaped) escaped = false;
                    else if (char === '\\') escaped = true;
                    else if (char === quote) quote = null;
                    i++;
                    continue;
                }
                if (char === '"' || char === "'" || char === '`') {
                    quote = char;
                    result += char;
                    i++;
                    continue;
                }
                if (char === '-' && next === '-' && code.substring(i, i + 4) === '--[[') {
                    const end = code.indexOf(']]', i + 4);
                    if (end === -1) break;
                    i = end + 2;
                    continue;
                }
                if (char === '-' && next === '-') {
                    i += 2;
                    while (i < code.length && code[i] !== '\n') i++;
                    continue;
                }
                result += char;
                i++;
            }
            return result;
        }

        function removeFunctionCalls(code) {
            let result = '';
            let i = 0;
            while (i < code.length) {
                let found = false;
                for (const name of ['print', 'warn']) {
                    if (code.startsWith(name, i) && (i === 0 || !/[A-Za-z0-9_]/.test(code[i - 1])) && !/[A-Za-z0-9_]/.test(code[i + name.length] || '')) {
                        let j = i + name.length;
                        while (j < code.length && /\s/.test(code[j])) j++;
                        if (code[j] === '(') {
                            let depth = 0;
                            let quote = null;
                            let escaped = false;
                            while (j < code.length) {
                                const ch = code[j];
                                if (quote !== null) {
                                    if (escaped) escaped = false;
                                    else if (ch === '\\') escaped = true;
                                    else if (ch === quote) quote = null;
                                } else {
                                    if (ch === '"' || ch === "'" || ch === '`') quote = ch;
                                    else if (ch === '(') depth++;
                                    else if (ch === ')') {
                                        depth--;
                                        if (depth === 0) {
                                            j++;
                                            break;
                                        }
                                    }
                                }
                                j++;
                            }
                            while (j < code.length && (code[j] === ' ' || code[j] === '\t')) j++;
                            if (code[j] === '\r') j++;
                            if (code[j] === '\n') j++;
                            i = j;
                            found = true;
                            break;
                        }
                    }
                }
                if (!found) {
                    result += code[i];
                    i++;
                }
            }
            return result;
        }

        function removeEmptyBranches(code) {
            let lines = code.split(/\r?\n/);
            let changed = true;
            while (changed) {
                changed = false;
                for (let i = 0; i < lines.length; i++) {
                    const current = lines[i].trim();
                    if (current === 'else' || /^elseif\b/.test(current)) {
                        let j = i + 1;
                        let hasCode = false;
                        let depth = 0;
                        while (j < lines.length) {
                            const line = lines[j].trim();
                            if (!line) { j++; continue; }
                            if (/^(if|for|while|repeat|function|do)\b/.test(line)) {
                                depth++;
                                hasCode = true;
                                j++;
                                continue;
                            }
                            if (line === 'end') {
                                if (depth > 0) { depth--; j++; continue; }
                                break;
                            }
                            if (depth === 0 && (line === 'else' || /^elseif\b/.test(line))) break;
                            if (depth === 0) { hasCode = true; break; }
                            j++;
                        }
                        if (!hasCode) {
                            lines.splice(i, 1);
                            changed = true;
                            break;
                        }
                    }
                }
            }
            return lines.join('\n');
        }

        function cleanEmptyLines(code) {
            return code.split(/\r?\n/).map(line => line.replace(/[ \t]+$/g, '')).join('\n').replace(/\n{3,}/g, '\n\n').trim();
        }

        function cleanScript() {
            let code = input.value;
            if (!code.trim()) {
                output.value = '';
                setStatus('⚠️ Cole ou escreva um script primeiro.', 'warn');
                setMainLed('amber', 'vazio');
                return;
            }
            try {
                code = removeComments(code);
                code = removeFunctionCalls(code);
                code = removeEmptyBranches(code);
                code = cleanEmptyLines(code);
                output.value = code;
                setStatus('✅ Script limpo com sucesso!', 'ok');
                setMainLed('green', 'limpo');
            } catch (e) {
                output.value = '';
                setStatus('❌ Erro ao processar: ' + e.message, 'warn');
                setMainLed('amber', 'erro');
            }
        }

        document.getElementById('cleanBtn').addEventListener('click', cleanScript);

        document.getElementById('copyBtnClean').addEventListener('click', async function() {
            const text = output.value;
            if (!text.trim()) {
                setStatus('⚠️ Não há resultado para copiar.', 'warn');
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                setStatus('✅ Script copiado para a área de transferência!', 'ok');
            } catch {
                try {
                    output.focus();
                    output.select();
                    document.execCommand('copy');
                    setStatus('✅ Script copiado!', 'ok');
                } catch {
                    setStatus('❌ Não foi possível copiar automaticamente.', 'warn');
                }
            }
        });

        document.getElementById('downloadBtnClean').addEventListener('click', function() {
            const text = output.value;
            if (!text.trim()) {
                setStatus('⚠️ Não há resultado para baixar.', 'warn');
                return;
            }
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'script_limpo.lua';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            setStatus('💾 Script baixado como script_limpo.lua', 'ok');
        });

        document.getElementById('clearBtnClean').addEventListener('click', function() {
            input.value = '';
            output.value = '';
            fileInput.value = '';
            setStatus('🗑️ Tudo foi limpo.', 'info');
            setMainLed('green', 'pronto');
        });

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                input.value = event.target.result;
                setStatus('📂 Arquivo carregado: ' + file.name, 'info');
                cleanScript();
            };
            reader.onerror = function() {
                setStatus('❌ Não foi possível ler o arquivo.', 'warn');
            };
            reader.readAsText(file);
        });

        input.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                cleanScript();
            }
        });

        output.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                cleanScript();
            }
        });

        input.addEventListener('input', function() {
            if (this.value.trim() === '') {
                setMainLed('amber', 'vazio');
            } else {
                setMainLed('green', 'editando');
            }
        });

        setStatus('✏️ Escreva ou cole um script e clique em <strong>Transformar</strong>', 'info');
        setMainLed('green', 'pronto');
    })();
</script>
</body>
</html>
